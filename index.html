<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BLACKSITE</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
      body { font-family: "Rajdhani", "Barlow Condensed", system-ui, sans-serif; cursor: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Boot / loading veil — replaced by UI agent later. */
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #05070a; color: #cfd8e3;
        transition: opacity .6s ease; letter-spacing: .35em; text-transform: uppercase;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .title { font-size: 34px; font-weight: 700; letter-spacing: .5em; color: #e8eef6; }
      #boot .bar { width: 320px; height: 2px; background: #1a2230; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0%; background: #d8a24a; transition: width .25s ease; }
      #boot .msg { font-size: 11px; opacity: .55; }

      /* Surfaced when the browser is rendering on an integrated GPU. */
      #gpu-warning {
        position: fixed; left: 50%; top: 22px; transform: translateX(-50%);
        z-index: 200; max-width: 620px; display: flex; flex-direction: column; gap: 7px;
        padding: 15px 20px; background: rgba(14, 18, 24, .94); color: #cfd8e3;
        border: 1px solid #d8a24a; border-left-width: 3px;
        font-size: 12px; line-height: 1.55; letter-spacing: .02em;
      }
      #gpu-warning strong {
        color: #e8b45f; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
      }
      #gpu-warning .gpu { font-family: ui-monospace, Consolas, monospace; font-size: 11px; opacity: .62; }
      #gpu-warning .fix { color: #9fd2a8; }
      #gpu-warning button {
        align-self: flex-start; margin-top: 3px; padding: 5px 13px; cursor: pointer;
        background: transparent; color: #cfd8e3; border: 1px solid #35404e;
        font: inherit; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      }
      #gpu-warning button:hover { border-color: #d8a24a; color: #e8b45f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="title">BLACKSITE</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="msg" id="boot-msg">initialising</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
